name: 'CI: n8n unit'

# Small check for pull requests into forcepoint-demo.
# GitHub-hosted runners only. Does not use the n8n CLA GitHub App,
# Blacksmith runners, Codecov, or other n8n CI secrets.
on:
  pull_request:
    branches:
      - forcepoint-demo
  push:
    branches:
      - forcepoint-demo

permissions:
  contents: read

concurrency:
  group: n8n-unit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  masking-unit:
    name: Edit Fields unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Jest compiles the Set node from source. Build the packages it imports,
      # not the nodes-base package and not the rest of the monorepo.
      - name: Build nodes-base dependencies
        run: pnpm turbo run build --filter=n8n-nodes-base^...

      # Edit Fields (Set) v2 tests only. Not the full nodes-base suite.
      - name: Run Edit Fields unit tests
        run: pnpm --filter n8n-nodes-base test -- nodes/Set/test/v2/ --ci --watchman=false --forceExit
