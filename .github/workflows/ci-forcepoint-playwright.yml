name: 'CI: Forcepoint Playwright'

# One Playwright spec for pull requests into forcepoint-demo.
# GitHub-hosted runners only. Does not use the n8n CLA GitHub App,
# Blacksmith runners, Currents, Codecov, or license secrets.
on:
  pull_request:
    branches:
      - forcepoint-demo
  push:
    branches:
      - forcepoint-demo

permissions:
  contents: read
  actions: write

concurrency:
  group: forcepoint-playwright-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  node-details:
    name: Node details configuration
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      # Absolute path so install and test:local share one browser cache.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/packages/testing/playwright/.playwright-browsers
      N8N_SKIP_LICENSES: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node.js
        uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # test:local starts the built CLI, which serves the built editor.
      - name: Build n8n
        run: pnpm turbo run build --filter=n8n...

      - name: Install Playwright Chromium
        run: pnpm --filter=n8n-playwright exec playwright install chromium --with-deps

      # 8 tests, including the Edit Fields masking test when that test is on the branch.
      # retries 0 so a failed selector stays failed. workers 1 keeps one local n8n server.
      - name: Run node details configuration
        run: pnpm --filter=n8n-playwright test:local tests/e2e/building-blocks/node-details-configuration.spec.ts --reporter=list --retries=0 --workers=1

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: forcepoint-playwright-results
          path: |
            packages/testing/playwright/test-results/
            packages/testing/playwright/playwright-report/
          retention-days: 7
          if-no-files-found: ignore
